[package]
name = "rsecnotes"
version = "0.9.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
base32 = "0.5.1"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
chrono = "0.4.42"
clap = { version = "4.5.47", features = ["derive"] }
futures-util = { version = "0.3.31", default-features = false }
hmac = "0.12.1"
rand = "0.9.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
toml = "0.9.8"

[build-dependencies]
base64 = "0.22.1"
sha2 = "0.10.9"

[profile.release]
panic = "abort"
