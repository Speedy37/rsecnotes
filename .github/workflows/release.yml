name: Release

# Pushing a version tag (eg. v0.9.0) builds the binaries and publishes them in a GitHub release
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Static binaries: musl is linked statically by default
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # The C runtime is linked statically, see RUSTFLAGS
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # Apple Silicon runner, Intel is cross compiled
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the Cargo.toml version
        shell: bash
        run: |
          version="v$(cargo pkgid | sed 's/.*[#@]//')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi

      - run: rustup update stable --no-self-update && rustup target add ${{ matrix.target }}

      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # build.rs compiles the client with tsc
      - run: npm ci

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="rsecnotes-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE src/config.example.toml "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/rsecnotes.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/rsecnotes" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - run: sha256sum *.tar.gz *.zip | tee SHA256SUMS

      # Created with generated notes, or completed if it was already created by hand
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *.tar.gz *.zip SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --generate-notes --verify-tag *.tar.gz *.zip SHA256SUMS
          fi
